apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distributedms-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/avinashperera/distributedms.git'
    targetRevision: HEAD
    path: k8s/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
